[project]
name = "demand-analysis-labs"
version = "0.1.0"
description = "Lab notebooks for demand analysis with text embeddings and double machine learning"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.1.0",
    "doubleml>=0.10",
    "ipykernel>=6.0",
    "jupyter>=1.0",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "pandas>=2.3",
    "scikit-learn>=1.8",
    "scipy>=1.17",
    "seaborn>=0.13",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
# Extra stack for the v2 labs. Only 02_finetune_embeddings.ipynb needs it.
# pytorch-widedeep and doubleml-deep are installed separately -- see v2/README.md,
# the former with --no-deps because it pins numpy<2.
v2 = [
    "torch>=2.0",
    "torchvision>=0.15",
    "lightning>=2.0",
    "torchmetrics>=1.0",
    "transformers>=4.35",
    "einops",
    "wrapt",
    "opencv-python-headless",
    "pillow",
    "pyarrow>=15.0",
]
